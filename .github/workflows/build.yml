
name: Build OpenWrt for Cudy TR3600 V1

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"

permissions:
  contents: read

concurrency:
  group: tr3600-v1-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v5

      - name: Free disk space
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3-dev \
            python3-setuptools python3-pyelftools \
            rsync unzip zlib1g-dev file wget curl \
            ca-certificates xsltproc swig time \
            libelf-dev libpython3-dev

      - name: Clone TR3600-compatible OpenWrt source
        shell: bash
        run: |
          set -euxo pipefail

          git clone --depth 1 \
            -b openwrt-25.12 \
            https://github.com/openwrt/openwrt.git openwrt

          cd openwrt
          git fetch origin pull/24596/head
          git checkout -f FETCH_HEAD

          echo "OpenWrt commit:"
          git rev-parse HEAD

      - name: Apply TR3600 V1 hardware fixes
        shell: bash
        run: |
          set -euxo pipefail

          curl -fL \
            https://raw.githubusercontent.com/hyqhyq3/openwrt-cudy-tr3600/main/cudy-tr3600-v1-fixes.patch \
            -o /tmp/cudy-tr3600-v1-fixes.patch

          cd openwrt
          git apply --check /tmp/cudy-tr3600-v1-fixes.patch
          git apply /tmp/cudy-tr3600-v1-fixes.patch

      - name: Install OpenWrt feeds and HomeProxy source
        shell: bash
        run: |
          set -euxo pipefail
          cd openwrt

          # Update the feeds matching the OpenWrt source branch.
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # HomeProxy is a standalone LuCI package, not a normal feed.
          git clone --depth 1 --branch master \
            https://github.com/immortalwrt/homeproxy.git \
            package/luci-app-homeproxy

          test -f feeds/luci/luci.mk
          test -f package/luci-app-homeproxy/Makefile
          grep -q '^PKG_NAME:=luci-app-homeproxy$' \
            package/luci-app-homeproxy/Makefile

          echo "HomeProxy commit:"
          git -C package/luci-app-homeproxy rev-parse HEAD

      - name: Configure firmware
        shell: bash
        run: |
          set -euxo pipefail
          cd openwrt

          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_cudy_tr3600-v1=y

          # LuCI and HomeProxy
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-app-homeproxy=y
          CONFIG_PACKAGE_sing-box=y
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_ucode-mod-digest=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_kmod-inet-diag=y
          CONFIG_PACKAGE_kmod-tun=y

          # USB phone tethering: RNDIS / CDC-ECM / CDC-NCM / iPhone
          CONFIG_PACKAGE_kmod-usb-net=y
          CONFIG_PACKAGE_kmod-usb-net-rndis=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-eem=y
          CONFIG_PACKAGE_kmod-usb-net-ipheth=y

          # Common USB Ethernet adapters
          CONFIG_PACKAGE_kmod-usb-net-asix=y
          CONFIG_PACKAGE_kmod-usb-net-asix-ax88179=y
          CONFIG_PACKAGE_kmod-usb-net-rtl8150=y
          CONFIG_PACKAGE_kmod-usb-net-rtl8152=y
          CONFIG_PACKAGE_kmod-usb-net-aqc111=y
          CONFIG_PACKAGE_kmod-usb-net-smsc75xx=y
          CONFIG_PACKAGE_kmod-usb-net-smsc95xx=y
          CONFIG_PACKAGE_kmod-usb-net-lan78xx=y
          CONFIG_PACKAGE_usbutils=y
          EOF

          make defconfig

          # Verify that the target and essential requested packages
          # survived Kconfig dependency resolution.
          required_options=(
            'CONFIG_TARGET_mediatek_filogic_DEVICE_cudy_tr3600-v1=y'
            'CONFIG_PACKAGE_luci-app-homeproxy=y'
            'CONFIG_PACKAGE_sing-box=y'
            'CONFIG_PACKAGE_kmod-usb-net-rndis=y'
            'CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y'
            'CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y'
            'CONFIG_PACKAGE_kmod-usb-net-rtl8152=y'
            'CONFIG_PACKAGE_kmod-usb-net-asix-ax88179=y'
          )

          for option in "${required_options[@]}"; do
            if ! grep -Fxq "$option" .config; then
              echo "ERROR: required option missing after make defconfig: $option"
              echo "Check package availability and dependency warnings above."
              exit 1
            fi
          done

          echo "Verified device, HomeProxy, sing-box, and core USB packages."
          grep -E '^CONFIG_PACKAGE_(luci-app-homeproxy|sing-box|kmod-usb-net)' .config || true

      - name: Download source packages
        shell: bash
        run: |
          set -euxo pipefail
          cd openwrt
          make -j2 download

      - name: Compile firmware
        shell: bash
        run: |
          set -euxo pipefail
          cd openwrt
          make -j2 V=s

      - name: Verify output and generate checksums
        shell: bash
        run: |
          set -euxo pipefail
          cd openwrt/bin/targets/mediatek/filogic

          ls -lh
          shopt -s nullglob
          images=( *cudy_tr3600-v1*squashfs-sysupgrade.bin )

          if [ "${#images[@]}" -eq 0 ]; then
            echo "ERROR: TR3600 V1 sysupgrade image not found"
            exit 1
          fi

          sha256sum "${images[@]}" > sha256sums.txt
          cat sha256sums.txt

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Cudy-TR3600-V1-OpenWrt-HomeProxy
          path: |
            openwrt/bin/targets/mediatek/filogic/*cudy_tr3600-v1*
            openwrt/bin/targets/mediatek/filogic/sha256sums.txt
          if-no-files-found: error
          retention-days: 14
