
name: Build OpenWrt for Cudy TR3600 V1

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"

permissions:
  contents: read

concurrency:
  group: tr3600-v1-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3-dev \
            python3-setuptools python3-pyelftools \
            rsync unzip zlib1g-dev file wget curl \
            ca-certificates xsltproc swig time \
            libelf-dev libpython3-dev

      - name: Clone TR3600-compatible OpenWrt source
        shell: bash
        run: |
          set -euxo pipefail

          git clone --depth 1 \
            -b openwrt-25.12 \
            https://github.com/openwrt/openwrt.git openwrt

          cd openwrt
          git fetch origin pull/24596/head
          git checkout -f FETCH_HEAD

          echo "OpenWrt commit:"
          git rev-parse HEAD

      - name: Apply TR3600 V1 hardware fixes
        shell: bash
        run: |
          set -euxo pipefail

          curl -fL \
            https://raw.githubusercontent.com/hyqhyq3/openwrt-cudy-tr3600/main/cudy-tr3600-v1-fixes.patch \
            -o /tmp/cudy-tr3600-v1-fixes.patch

          cd openwrt
          git apply --check /tmp/cudy-tr3600-v1-fixes.patch
          git apply /tmp/cudy-tr3600-v1-fixes.patch

      - name: Add HomeProxy package feed
        shell: bash
        run: |
          set -euxo pipefail
          cd openwrt

          echo 'src-git homeproxy https://github.com/immortalwrt/homeproxy.git' \
            >> feeds.conf.default

          ./scripts/feeds update -a

          ./scripts/feeds install -a

          # Explicitly install the HomeProxy LuCI package.
          ./scripts/feeds install -p homeproxy luci-app-homeproxy

      - name: Configure firmware
        shell: bash
        run: |
          set -euxo pipefail
          cd openwrt

          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_cudy_tr3600-v1=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-app-homeproxy=y

          CONFIG_PACKAGE_kmod-usb-net=y
          CONFIG_PACKAGE_kmod-usb-net-rndis=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-eem=y
          CONFIG_PACKAGE_kmod-usb-net-ipheth=y

          CONFIG_PACKAGE_kmod-usb-net-rtl8150=y
          CONFIG_PACKAGE_kmod-usb-net-rtl8152=y
          CONFIG_PACKAGE_kmod-usb-net-ax88179=y
          CONFIG_PACKAGE_kmod-usb-net-aqc111=y

          CONFIG_PACKAGE_usbutils=y
          EOF

          make defconfig

          grep -q '^CONFIG_TARGET_mediatek_filogic_DEVICE_cudy_tr3600-v1=y$' .config \
            || { echo "ERROR: TR3600 V1 device profile missing"; exit 1; }

          grep -q '^CONFIG_PACKAGE_luci-app-homeproxy=y$' .config \
            || { echo "ERROR: HomeProxy package unavailable or incompatible"; exit 1; }

          echo "Selected USB packages:"
          grep -E '^CONFIG_PACKAGE_kmod-usb-net' .config || true

      - name: Download source packages
        run: |
          cd openwrt
          make -j2 download

      - name: Compile firmware
        run: |
          set -euxo pipefail
          cd openwrt
          make -j2 V=s

      - name: Verify output and generate checksums
        shell: bash
        run: |
          set -euxo pipefail
          cd openwrt/bin/targets/mediatek/filogic

          ls -lh
          shopt -s nullglob
          images=( *cudy_tr3600-v1*squashfs-sysupgrade.bin )

          if [ "${#images[@]}" -eq 0 ]; then
            echo "ERROR: TR3600 V1 sysupgrade image not found"
            exit 1
          fi

          sha256sum "${images[@]}" > sha256sums.txt
          cat sha256sums.txt

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Cudy-TR3600-V1-OpenWrt-HomeProxy
          path: |
            openwrt/bin/targets/mediatek/filogic/*cudy_tr3600-v1*
            openwrt/bin/targets/mediatek/filogic/sha256sums.txt
          if-no-files-found: error
          retention-days: 14
